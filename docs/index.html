<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f8fa" />
    <meta name="description" content="把出國前準備、行程與採買集中管理的旅行工作台。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>旅程備忘｜旅行工作台</title>
    <style>
      :root {
        --ink: #253b50;
        --muted: #7b8b9b;
        --line: #e4ebf0;
        --paper: #f5f8fa;
        --card: #ffffff;
        --accent: #85aabd;
        --accent-dark: #6e94a8;
        --blue: #6f9bb0;
        --mint: #e5f2ee;
        --yellow: #f5efdc;
        --shadow: 0 14px 40px rgba(58, 84, 103, 0.07);
        --radius-lg: 24px;
        --radius-md: 16px;
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        background: linear-gradient(180deg, #f8fafb 0%, var(--paper) 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(133, 170, 189, .28); outline-offset: 2px; }

      .app-shell { max-width: 1420px; margin: 0 auto; padding: 24px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 26px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: #e8f1f4; color: #46677c; box-shadow: 0 7px 18px rgba(72, 106, 124, .10); }
      .brand-mark svg { width: 25px; height: 25px; }
      .brand h1 { font-size: 1.1rem; margin: 0; letter-spacing: .01em; }
      .brand p { margin: 2px 0 0; color: var(--muted); font-size: .84rem; }
      .top-actions { display: flex; align-items: center; gap: 10px; }
      .storage-note { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .86rem; }
      .storage-dot { width: 8px; height: 8px; border-radius: 50%; background: #36a87b; box-shadow: 0 0 0 4px rgba(54, 168, 123, .12); }
      .icon-btn { display: grid; place-items: center; border: 1px solid var(--line); color: var(--ink); background: rgba(255,255,255,.82); width: 42px; height: 42px; border-radius: 12px; }
      .icon-btn:hover { border-color: #cbdde5; background: #fff; }

      .hero { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .8fr); gap: 18px; margin-bottom: 18px; }
      .hero-card { border: 1px solid #e0ebef; border-radius: var(--radius-lg); background: linear-gradient(145deg, #edf5f7 0%, #f9fbfc 100%); color: var(--ink); padding: 30px 32px; min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; box-shadow: var(--shadow); }
      .hero-card::after { content: ""; position: absolute; width: 210px; height: 210px; border-radius: 50%; border: 1px solid rgba(93, 139, 158, .16); right: -70px; bottom: -80px; box-shadow: 0 0 0 28px rgba(145, 181, 194, .09), 0 0 0 56px rgba(145, 181, 194, .05); }
      .eyebrow { margin: 0 0 8px; color: #6f98ab; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .hero-card h2 { max-width: 620px; margin: 0; font-size: clamp(1.7rem, 4vw, 3rem); line-height: 1.1; letter-spacing: -.04em; }
      .hero-card .hero-foot { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; margin-top: 25px; }
      .progress-bar { width: min(280px, 55vw); height: 8px; border-radius: 99px; background: #dce8ed; overflow: hidden; }
      .progress-bar span { display: block; height: 100%; width: 0%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
      .hero-foot small { color: var(--muted); }
      .summary-card { display: flex; flex-direction: column; justify-content: space-between; padding: 26px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow); }
      .summary-label { color: var(--muted); font-size: .86rem; }
      .summary-number { margin: 4px 0 2px; font-size: 3.3rem; line-height: 1; font-weight: 750; letter-spacing: -.05em; }
      .summary-card p { margin: 0; color: var(--muted); font-size: .9rem; }
      .summary-chips { display: flex; gap: 8px; margin-top: 22px; }
      .summary-chip { padding: 8px 10px; border-radius: 10px; background: #f2f6f8; color: var(--muted); font-size: .82rem; }
      .summary-chip strong { display: block; color: var(--ink); font-size: 1.05rem; }

      .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
      .main-panel, .side-card { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
      .main-panel { min-width: 0; padding: 26px; }
      .tabs { display: flex; gap: 6px; padding-bottom: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { border: 0; white-space: nowrap; padding: 10px 14px; border-radius: 10px; color: var(--muted); background: transparent; font-weight: 700; }
      .tab:hover { color: var(--ink); background: #f1f6f8; }
      .tab.active { color: #365b70; background: #dcecf0; box-shadow: inset 0 0 0 1px #c9e0e7; }
      .tab-count { display: inline-block; min-width: 21px; margin-left: 5px; padding: 1px 5px; border-radius: 20px; background: rgba(16,36,62,.08); font-size: .75rem; }
      .tab.active .tab-count { background: rgba(255,255,255,.22); }
      .panel-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 24px 0 16px; }
      .panel-head h3 { margin: 0; font-size: 1.4rem; letter-spacing: -.03em; }
      .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
      .primary-btn { border: 0; border-radius: 12px; padding: 11px 16px; color: #fff; background: var(--accent); font-weight: 750; box-shadow: 0 7px 16px rgba(105, 151, 173, .18); }
      .primary-btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
      .secondary-btn { border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; color: var(--ink); background: #fff; font-weight: 700; }
      .secondary-btn:hover { border-color: #c9d4e0; background: #fafcfe; }
      .filter-row { display: grid; grid-template-columns: minmax(0, 1fr) 148px; gap: 8px; margin-bottom: 16px; }
      .filter-row input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; color: var(--ink); background: #fcfdfe; }
            .filter-menu { position: relative; min-width: 0; }
      .filter-select { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; color: var(--ink); background: #fcfdfe; font: inherit; text-align: left; cursor: pointer; }
      .filter-select svg { flex: 0 0 auto; color: var(--muted); transition: transform .2s ease; }
      .filter-menu.open .filter-select svg { transform: rotate(180deg); }
      .filter-options { position: absolute; z-index: 8; top: calc(100% + 6px); right: 0; left: 0; display: grid; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.98); box-shadow: 0 14px 28px rgba(58,84,103,.13); opacity: 0; visibility: hidden; transform: translateY(-4px); pointer-events: none; transition: opacity .18s ease, transform .18s ease, visibility .18s ease; }
      .filter-menu.open .filter-options { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
      .filter-option { width: 100%; border: 0; border-radius: 8px; padding: 9px 10px; color: var(--ink); background: transparent; font: inherit; text-align: left; cursor: pointer; }
      .filter-option:hover, .filter-option.active { color: #365b70; background: #e9f2f5; }

      .items-list { display: grid; gap: 10px; }
      .list-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px; background: #fff; transition: border-color .2s, box-shadow .2s, transform .2s; }
      .list-item:hover { border-color: #cbdde5; box-shadow: 0 8px 22px rgba(58,84,103,.06); transform: translateY(-1px); }
      .list-item.done { background: #fbfdfc; }
      .check { appearance: none; width: 22px; height: 22px; margin: 0; border: 2px solid #cad4df; border-radius: 7px; background: #fff; position: relative; }
      .check:checked { border-color: var(--blue); background: var(--blue); }
      .check:checked::after { content: ""; position: absolute; width: 5px; height: 10px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; left: 50%; top: 50%; transform: translate(-50%, -60%) rotate(45deg); }
      .item-title { min-width: 0; margin: 0; font-weight: 750; overflow-wrap: anywhere; }
      .done .item-title { color: #8a98a7; text-decoration: line-through; }
      .item-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 3px; color: var(--muted); font-size: .82rem; }
      .tag { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; color: #557586; background: #eef4f7; font-size: .76rem; font-weight: 700; }
      .tag.mint { color: #2e7865; background: var(--mint); }
      .tag.yellow { color: #8b6b20; background: var(--yellow); }
      .item-actions { display: flex; gap: 4px; }
      .mini-btn { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; }
      .mini-btn:hover { color: var(--ink); background: #f0f4f7; }
      .mini-btn.delete:hover { color: #c44335; background: #fff0ed; }
      .empty { display: grid; place-items: center; padding: 45px 20px; border: 1px dashed #cfdae5; border-radius: var(--radius-md); background: #f8fafb; text-align: center; }
      .empty-icon { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 10px; border-radius: 16px; color: var(--blue); background: #eef5f7; }
      .empty h4 { margin: 0 0 4px; }
      .empty p { max-width: 330px; margin: 0; color: var(--muted); font-size: .9rem; }

      .side-stack { display: grid; gap: 18px; }
      .side-card { padding: 22px; }
      .side-card h3 { margin: 0 0 15px; font-size: 1.05rem; }
      .tip { padding: 15px; border-radius: 14px; background: #f1f6ef; }
      .tip strong { display: block; margin-bottom: 4px; }
      .tip p { margin: 0; color: #6d7d63; font-size: .88rem; }
      .upcoming { display: grid; gap: 12px; }
      .upcoming-item { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 10px; align-items: center; }
      .date-block { display: grid; place-items: center; padding: 5px 2px; border-radius: 10px; color: var(--blue); background: #eef5f7; line-height: 1.05; }
      .date-block b { font-size: 1.1rem; }
      .date-block small { font-size: .64rem; }
      .upcoming-title { margin: 0; font-size: .9rem; font-weight: 750; overflow-wrap: anywhere; }
      .upcoming-meta { margin: 2px 0 0; color: var(--muted); font-size: .78rem; }

      .modal-backdrop { display: none; position: fixed; inset: 0; z-index: 10; padding: 18px; place-items: center; background: rgba(55,78,95,.25); backdrop-filter: blur(5px); }
      .modal-backdrop.show { display: grid; }
      .modal { width: min(100%, 520px); max-height: calc(100vh - 36px); overflow: auto; border-radius: 22px; background: #fff; box-shadow: 0 26px 80px rgba(58,84,103,.18); }
      .modal-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 22px 22px 8px; }
      .modal-head h3 { margin: 0; font-size: 1.3rem; }
      .modal-body { display: grid; gap: 14px; padding: 14px 22px 22px; }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .field { display: grid; gap: 6px; }
      .field label { color: var(--muted); font-size: .84rem; font-weight: 700; }
      .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; color: var(--ink); background: #fbfcfe; }
      .form-menu, .date-picker, .time-picker { position: relative; min-width: 0; }
      .form-menu-button, .picker-button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; color: var(--ink); background: #fbfcfe; font: inherit; text-align: left; cursor: pointer; }
      .form-menu-button svg, .picker-button svg { flex: 0 0 auto; color: var(--muted); transition: transform .2s ease; }
      .form-menu.open .form-menu-button svg, .date-picker.open .picker-button svg, .time-picker.open .picker-button svg { transform: rotate(180deg); }
      .form-menu-options, .picker-panel { position: absolute; z-index: 12; top: calc(100% + 6px); left: 0; width: min(300px, calc(100vw - 72px)); padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.98); box-shadow: 0 14px 28px rgba(58,84,103,.13); opacity: 0; visibility: hidden; transform: translateY(-4px); pointer-events: none; transition: opacity .18s ease, transform .18s ease, visibility .18s ease; }
      .form-menu-options { display: grid; gap: 4px; }
      .form-menu.open .form-menu-options, .date-picker.open .picker-panel, .time-picker.open .picker-panel { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
      .form-menu-option { width: 100%; border: 0; border-radius: 8px; padding: 9px 10px; color: var(--ink); background: transparent; font: inherit; text-align: left; cursor: pointer; }
      .form-menu-option:hover, .form-menu-option.active { color: #365b70; background: #e9f2f5; }
      .picker-panel { padding: 12px; }
      .time-panel { width: min(230px, calc(100vw - 72px)); }
      .picker-head { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 8px; margin-bottom: 10px; text-align: center; }
      .picker-head strong { color: var(--ink); font-size: .92rem; }
      .picker-nav { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; cursor: pointer; }
      .picker-nav:hover { color: var(--ink); background: #eef4f7; }
      .calendar-week, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
      .calendar-week { margin-bottom: 5px; color: var(--muted); font-size: .72rem; text-align: center; }
      .calendar-grid { min-height: 190px; }
      .calendar-empty { display: block; }
      .calendar-day { display: grid; place-items: center; min-height: 28px; border: 0; border-radius: 8px; color: var(--ink); background: transparent; font: inherit; font-size: .82rem; cursor: pointer; }
      .calendar-day:hover { background: #eef4f7; }
      .calendar-day.today { box-shadow: inset 0 0 0 1px #c9e0e7; }
      .calendar-day.selected { color: #fff; background: var(--accent); font-weight: 750; }
      .time-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; max-height: 220px; overflow-y: auto; }
      .time-option { border: 0; border-radius: 8px; padding: 9px 5px; color: var(--ink); background: transparent; font: inherit; font-size: .84rem; cursor: pointer; }
      .time-option:hover, .time-option.selected { color: #365b70; background: #e9f2f5; }
      .picker-clear { width: 100%; margin-top: 10px; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--muted); background: #f1f6f8; font: inherit; cursor: pointer; }
      .picker-clear:hover { color: var(--ink); background: #e6f0f3; }
      .field textarea { min-height: 88px; resize: vertical; }
      .modal-actions { display: flex; justify-content: end; gap: 9px; margin-top: 4px; }
      .confirm-modal { width: min(100%, 430px); }
      .confirm-message { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
      .danger-btn { border: 0; border-radius: 12px; padding: 11px 16px; color: #fff; background: var(--accent-dark); box-shadow: 0 7px 16px rgba(105, 151, 173, .18); font-weight: 750; }
      .danger-btn:hover { background: var(--ink); }
      .toast { position: fixed; right: 22px; bottom: 22px; z-index: 20; max-width: min(360px, calc(100vw - 44px)); transform: translateY(20px); opacity: 0; pointer-events: none; padding: 12px 15px; border-radius: 12px; color: #fff; background: var(--ink); box-shadow: var(--shadow); transition: .25s ease; }
      .toast.show { transform: translateY(0); opacity: 1; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

      @media (max-width: 900px) {
        .workspace { grid-template-columns: 1fr; }
        .side-stack { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 650px) {
        .app-shell { padding: 16px; }
        .topbar { align-items: flex-start; margin-bottom: 18px; }
        .storage-note { display: none; }
        .hero { grid-template-columns: 1fr; gap: 12px; }
        .hero-card { min-height: 210px; padding: 24px; }
        .summary-card { padding: 20px 22px; }
        .summary-number { font-size: 2.7rem; }
        .main-panel { padding: 16px; border-radius: 20px; }
        .panel-head { align-items: flex-start; padding-top: 18px; }
        .panel-head .primary-btn { padding: 10px 12px; font-size: .9rem; }
        .filter-row { display: grid; grid-template-columns: minmax(0, 1fr) 148px; }
        .filter-row input { grid-column: 1 / -1; }
        .side-stack { grid-template-columns: 1fr; gap: 12px; }
        .side-card { padding: 18px; }
      }
      @media (max-width: 430px) {
        .brand p { display: none; }
        .hero-card h2 { font-size: 1.8rem; }
        .list-item { gap: 9px; padding: 12px; }
        .item-actions { flex-direction: column; }
        .form-row { grid-template-columns: 1fr; gap: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 12 3l8 3.5v11L12 21l-8-3.5v-11Z"/><path d="m4 6.5 8 3.5 8-3.5M12 10v11"/></svg>
          </div>
          <div><h1>旅程備忘</h1><p>把出發前的大小事，放在同一個地方</p></div>
        </div>
        <div class="top-actions">
          <span class="storage-note"><i class="storage-dot"></i>資料儲存在此裝置</span>
          <button class="icon-btn" id="exportBtn" type="button" title="匯出備份" aria-label="匯出備份">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
          </button>
          <button class="icon-btn" id="importBtn" type="button" title="匯入備份" aria-label="匯入備份">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 21h14"/></svg>
          </button>
          <input class="sr-only" id="importFile" type="file" accept="application/json" />
        </div>
      </header>

      <main>
        <section class="hero" aria-label="旅程概況">
          <div class="hero-card">
            <div>
              <p class="eyebrow">GO GO GO</p>
              <h2>準備好了嗎 !</h2>
            </div>
            <div class="hero-foot"><div class="progress-bar" aria-label="整體完成進度"><span id="overallProgress"></span></div><small id="progressText">準備開始</small></div>
          </div>
          <div class="summary-card">
            <div><div class="summary-label">目前待辦</div><div class="summary-number" id="pendingNumber">0</div><p>項目等著你處理</p></div>
            <div class="summary-chips"><div class="summary-chip"><strong id="scheduleCount">0</strong>行程</div><div class="summary-chip"><strong id="shoppingCount">0</strong>採買</div></div>
          </div>
        </section>

        <section class="workspace">
          <div class="main-panel">
            <nav class="tabs" aria-label="內容分類">
              <button class="tab active" data-view="packing" type="button">準備清單 <span class="tab-count" id="packingTabCount">0</span></button>
              <button class="tab" data-view="schedule" type="button">行程 <span class="tab-count" id="scheduleTabCount">0</span></button>
              <button class="tab" data-view="shopping" type="button">購買清單 <span class="tab-count" id="shoppingTabCount">0</span></button>
            </nav>
            <div class="panel-head"><div><h3 id="panelTitle">出發前要帶什麼？</h3><p id="panelDescription">先把腦中想到的東西記下來</p></div><button class="primary-btn" id="addBtn" type="button">＋ 新增</button></div>
            <div class="filter-row"><label class="sr-only" for="searchInput">搜尋</label><input id="searchInput" placeholder="搜尋項目…" type="search" /><div class="filter-menu" id="statusMenu"><button class="filter-select" id="statusFilter" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="篩選狀態"><span id="statusFilterLabel">全部</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="filter-options" id="statusOptions" role="listbox" aria-label="篩選狀態"><button class="filter-option active" type="button" role="option" data-value="all" aria-selected="true">全部</button><button class="filter-option" type="button" role="option" data-value="pending" aria-selected="false">未完成</button><button class="filter-option" type="button" role="option" data-value="done" aria-selected="false">已完成</button></div></div></div>
            <div class="items-list" id="itemsList"></div>

="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></button><div class="picker-panel time-panel" id="timePanel"><div class="time-options" id="timeOptions"></div><button class="picker-clear" id="timeClear" type="button">清除時間</button></div></div></div></div>

<div class="modal-backdrop" id="confirmBackdrop" role="presentation">
      <section class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-head"><h3 id="confirmTitle">刪除這個項目？</h3><button class="icon-btn" id="closeDeleteConfirm" type="button" aria-label="關閉確認視窗">×</button></div>
        <div class="modal-body"><p class="confirm-message" id="confirmMessage"></p><div class="modal-actions"><button class="secondary-btn" id="cancelDelete" type="button">保留項目</button><button class="danger-btn" id="confirmDelete" type="button">刪除</button></div></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (() => {
        const STORAGE_KEY = 'trip-notes-v1';
        const seed = {
          packing: [
            { id: 'p1', title: '護照與簽證文件', category: '重要文件', note: '確認效期與電子備份', done: false },
            { id: 'p2', title: '常備藥品', category: '藥品', note: '退燒、腸胃、個人處方藥', done: true },
            { id: 'p3', title: '行動電源與充電線', category: '電子用品', note: '', done: false }
          ],
          schedule: [{ id: 's1', title: '抵達後前往住宿', date: new Date().toISOString().slice(0, 10), time: '16:00', note: '記得先確認入住時間', done: false }],
          shopping: [{ id: 'b1', title: '萬國轉接頭', category: '電子用品', note: '出發前買好', price: '590', done: false }]
        };
        let data = loadData();
        let activeView = 'packing';
        let editingId = null;
        let pendingDelete = null;
        let statusFilterValue = 'all';
        let toastTimer;
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c]));

        function loadData() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); return saved && saved.packing && saved.schedule && saved.shopping ? saved : structuredClone(seed); } catch { return structuredClone(seed); } }
        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); render(); }
        function uid() { return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
        function showToast(message) { const el = $('toast'); el.textContent = message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400); }
        function currentItems() { return data[activeView]; }
        function setStatusFilter(value) { const labels = { all: '全部', pending: '未完成', done: '已完成' }; statusFilterValue = labels[value] ? value : 'all'; $('statusFilterLabel').textContent = labels[statusFilterValue]; document.querySelectorAll('.filter-option').forEach((option) => { const active = option.dataset.value === statusFilterValue; option.classList.toggle('active', active); option.setAttribute('aria-selected', active ? 'true' : 'false'); }); }
        function toggleStatusMenu() { const menu = $('statusMenu'); const open = !menu.classList.contains('open'); menu.classList.toggle('open', open); $('statusFilter').setAttribute('aria-expanded', String(open)); }
        function closeStatusMenu() { $('statusMenu').classList.remove('open'); $('statusFilter').setAttribute('aria-expanded', 'false'); }
        let calendarCursor = new Date();
        calendarCursor.setDate(1);
        function setCategory(value) { const options = ['重要文件', '衣物', '電子用品', '藥品', '其他']; const selected = options.includes(value) ? value : '其他'; $('itemCategory').value = selected; $('itemCategoryLabel').textContent = selected; document.querySelectorAll('.form-menu-option').forEach((option) => { const active = option.dataset.value === selected; option.classList.toggle('active', active); option.setAttribute('aria-selected', active ? 'true' : 'false'); }); }
        function closeCategoryMenu() { $('categoryMenu').classList.remove('open'); $('itemCategoryButton').setAttribute('aria-expanded', 'false'); }
        function toggleCategoryMenu() { closeFormPickers(); const menu = $('categoryMenu'); const open = !menu.classList.contains('open'); menu.classList.toggle('open', open); $('itemCategoryButton').setAttribute('aria-expanded', String(open)); }
        function pad(value) { return String(value).padStart(2, '0'); }
        function formatDateValue(date) { return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()); }
        function formatDateLabel(value) { if (!value) return '選擇日期'; const parts = value.split('-'); return parts[0] + '年' + Number(parts[1]) + '月' + Number(parts[2]) + '日'; }
        function setDate(value) { $('itemDate').value = value || ''; $('itemDateLabel').textContent = formatDateLabel(value); renderCalendar(); }
        function closeDatePicker() { $('datePicker').classList.remove('open'); $('itemDateButton').setAttribute('aria-expanded', 'false'); }
        function renderCalendar() { const year = calendarCursor.getFullYear(); const month = calendarCursor.getMonth(); $('dateMonthLabel').textContent = year + '年' + (month + 1) + '月'; const grid = $('dateGrid'); grid.innerHTML = ''; const firstDay = new Date(year, month, 1).getDay(); const days = new Date(year, month + 1, 0).getDate(); const selected = $('itemDate').value; const today = formatDateValue(new Date()); for (let i = 0; i < firstDay; i += 1) { const empty = document.createElement('span'); empty.className = 'calendar-empty'; grid.appendChild(empty); } for (let day = 1; day <= days; day += 1) { const date = new Date(year, month, day); const value = formatDateValue(date); const button = document.createElement('button'); button.className = 'calendar-day' + (value === selected ? ' selected' : '') + (value === today ? ' today' : ''); button.type = 'button'; button.textContent = day; button.dataset.date = value; button.addEventListener('click', () => { setDate(value); closeDatePicker(); }); grid.appendChild(button); } }
        function openDatePicker() { closeFormPickers(); const value = $('itemDate').value; calendarCursor = value ? new Date(value + 'T00:00:00') : new Date(); calendarCursor.setDate(1); renderCalendar(); $('datePicker').classList.add('open'); $('itemDateButton').setAttribute('aria-expanded', 'true'); }
        function closeTimePicker() { $('timePicker').classList.remove('open'); $('itemTimeButton').setAttribute('aria-expanded', 'false'); }
        function setTime(value) { $('itemTime').value = value || ''; $('itemTimeLabel').textContent = value || '選擇時間'; document.querySelectorAll('.time-option').forEach((option) => option.classList.toggle('selected', option.dataset.time === value)); }
        function renderTimeOptions() { const container = $('timeOptions'); container.innerHTML = ''; const current = $('itemTime').value; for (let hour = 0; hour < 24; hour += 1) { for (let minute = 0; minute < 60; minute += 15) { const value = pad(hour) + ':' + pad(minute); const button = document.createElement('button'); button.className = 'time-option' + (value === current ? ' selected' : ''); button.type = 'button'; button.textContent = value; button.dataset.time = value; button.addEventListener('click', () => { setTime(value); closeTimePicker(); }); container.appendChild(button); } } }
        function openTimePicker() { closeFormPickers(); renderTimeOptions(); $('timePicker').classList.add('open'); $('itemTimeButton').setAttribute('aria-expanded', 'true'); }
        function closeFormPickers() { closeCategoryMenu(); closeDatePicker(); closeTimePicker(); }
        function dateLabel(date) { if (!date) return ''; const d = new Date(`${date}T00:00:00`); return `${d.getMonth() + 1}/${d.getDate()}`; }
        function render() {
          const all = Object.values(data).flat(); const done = all.filter((item) => item.done).length; const pending = all.length - done; const percent = all.length ? Math.round(done / all.length * 100) : 0;
          $('overallProgress').style.width = `${percent}%`; $('progressText').textContent = all.length ? `${percent}% 已完成` : '準備開始'; $('pendingNumber').textContent = pending; $('scheduleCount').textContent = data.schedule.length; $('shoppingCount').textContent = data.shopping.length;
          $('packingTabCount').textContent = data.packing.length; $('scheduleTabCount').textContent = data.schedule.length; $('shoppingTabCount').textContent = data.shopping.length;
          document.querySelectorAll('.tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.view === activeView));
          const copy = { packing: ['出發前要帶什麼？', '先把腦中想到的東西記下來'], schedule: ['這趟旅程怎麼走？', '把重要時間點放進來，途中更安心。'], shopping: ['還需要買什麼？', '記下品項與預算，採買時一次搞定。'] }[activeView]; $('panelTitle').textContent = copy[0]; $('panelDescription').textContent = copy[1];
          const query = $('searchInput').value.trim().toLowerCase(); const filter = statusFilterValue; const items = currentItems().filter((item) => (!query || [item.title, item.note, item.category].join(' ').toLowerCase().includes(query)) && (filter === 'all' || (filter === 'done' ? item.done : !item.done)));
          $('itemsList').innerHTML = items.length ? items.map(itemTemplate).join('') : `<div class="empty"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/></svg></div><h4>${query || filter !== 'all' ? '找不到符合的項目' : '這裡還是空的'}</h4><p>${query || filter !== 'all' ? '換個關鍵字或篩選條件試試看。' : '按下「新增項目」，把下一件要做的事放進來。'}</p></div>`;
          renderUpcoming();
        }
        function itemTemplate(item) { const tags = activeView === 'schedule' ? `<span class="tag">${esc(dateLabel(item.date)) || '未排日期'}${item.time ? ` · ${esc(item.time)}` : ''}</span>` : activeView === 'shopping' ? `<span class="tag yellow">${item.price ? `NT$ ${esc(item.price)}` : '待估價'}</span>` : `<span class="tag mint">${esc(item.category || '其他')}</span>`; return `<article class="list-item ${item.done ? 'done' : ''}"><input class="check" type="checkbox" data-action="toggle" data-id="${esc(item.id)}" ${item.done ? 'checked' : ''} aria-label="標記 ${esc(item.title)} 為${item.done ? '未完成' : '完成'}" /><div><p class="item-title">${esc(item.title)}</p><div class="item-meta">${tags}${item.note ? `<span>${esc(item.note)}</span>` : ''}</div></div><div class="item-actions"><button class="mini-btn" data-action="edit" data-id="${esc(item.id)}" type="button" title="編輯" aria-label="編輯 ${esc(item.title)}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16.5-.8 3.8 3.8-.8L18.5 8l-3.7-3.7L4 16.5Z"/><path d="m13.5 5.5 3.7 3.7"/></svg></button><button class="mini-btn delete" data-action="delete" data-id="${esc(item.id)}" type="button" title="刪除" aria-label="刪除 ${esc(item.title)}">×</button></div></article>`; }
        function renderUpcoming() { const list = data.schedule.filter((i) => !i.done).sort((a,b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)).slice(0, 3); $('upcomingList').innerHTML = list.length ? list.map((item) => `<div class="upcoming-item"><div class="date-block"><b>${item.date ? new Date(`${item.date}T00:00:00`).getDate() : '—'}</b><small>${item.date ? `${new Date(`${item.date}T00:00:00`).getMonth()+1}月` : '待排'}</small></div><div><p class="upcoming-title">${esc(item.title)}</p><p class="upcoming-meta">${item.time ? esc(item.time) : '尚未設定時間'}${item.note ? ` · ${esc(item.note)}` : ''}</p></div></div>`).join('') : '<p style="color:var(--muted);font-size:.9rem;margin:0">目前沒有未完成的行程。</p>'; }
        function openModal(id = null) { editingId = id; const item = id ? currentItems().find((i) => i.id === id) : null; $('modalTitle').textContent = id ? '編輯項目' : '新增項目'; $('itemForm').reset(); setCategory('其他'); setDate(''); setTime(''); if (item) { $('itemTitle').value = item.title || ''; setCategory(item.category || '其他'); $('itemNote').value = item.note || ''; setDate(item.date || ''); setTime(item.time || ''); $('itemPrice').value = item.price || ''; } $('scheduleFields').hidden = activeView !== 'schedule'; $('priceField').hidden = activeView !== 'shopping'; $('commonFields').hidden = activeView === 'schedule'; $('modalBackdrop').classList.add('show'); setTimeout(() => $('itemTitle').focus(), 50); }
        function closeModal() { closeFormPickers(); $('modalBackdrop').classList.remove('show'); editingId = null; }
function openDeleteConfirm(item) { pendingDelete = { view: activeView, id: item.id, title: item.title }; $('confirmMessage').textContent = '確定要刪除「' + item.title + '」嗎？刪除後無法復原。'; $('confirmBackdrop').classList.add('show'); setTimeout(() => $('confirmDelete').focus(), 50); }
        function closeDeleteConfirm() { $('confirmBackdrop').classList.remove('show'); pendingDelete = null; }
        function confirmDelete() { if (!pendingDelete) return; const list = data[pendingDelete.view] || []; data[pendingDelete.view] = list.filter((item) => item.id !== pendingDelete.id); closeDeleteConfirm(); saveData(); showToast('項目已刪除'); }
        function submitForm(event) { event.preventDefault(); const form = new FormData(event.currentTarget); const item = { id: editingId || uid(), title: form.get('title').trim(), category: form.get('category'), note: form.get('note').trim(), date: form.get('date'), time: form.get('time'), price: form.get('price'), done: editingId ? currentItems().find((i) => i.id === editingId).done : false }; if (!item.title) return; if (editingId) data[activeView] = currentItems().map((i) => i.id === editingId ? item : i); else data[activeView].unshift(item); closeModal(); saveData(); showToast(editingId ? '項目已更新' : '項目已新增'); }
        function exportData() { const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `旅程備忘-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url); showToast('備份檔已下載'); }
        function registerWebMcp() { const context = document.modelContext; if (!context?.registerTool) return; const lifecycle = new AbortController(); const tool = { name: 'add_trip_note', title: '新增旅行項目', description: '新增一筆準備清單、行程或購買清單項目，並同步更新畫面與本機資料。', inputSchema: { type:'object', properties:{ list:{ type:'string', enum:['packing','schedule','shopping'] }, title:{ type:'string' }, note:{ type:'string' }, date:{ type:'string' }, time:{ type:'string' }, price:{ type:'string' } }, required:['list','title'], additionalProperties:false }, annotations:{ readOnlyHint:false }, execute(input) { if (!input || !['packing','schedule','shopping'].includes(input.list) || typeof input.title !== 'string' || !input.title.trim()) throw new Error('需要有效的清單與項目名稱'); data[input.list].unshift({ id: uid(), title: input.title.trim(), note: input.note || '', date: input.date || '', time: input.time || '', price: input.price || '', category: input.list === 'packing' ? '其他' : '', done: false }); saveData(); return { ok:true, list:input.list, title:input.title.trim() }; } }; try { Promise.resolve(context.registerTool(tool, { signal:lifecycle.signal })).catch(() => {}); } catch {} }

        document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => { activeView = tab.dataset.view; $('searchInput').value = ''; setStatusFilter('all'); closeStatusMenu(); render(); }));
$('addBtn').addEventListener('click', () => openModal()); $('closeModal').addEventListener('click', closeModal); $('cancelModal').addEventListener('click', closeModal); $('modalBackdrop').addEventListener('click', (e) => { if (e.target === $('modalBackdrop')) closeModal(); }); $('closeDeleteConfirm').addEventListener('click', closeDeleteConfirm); $('cancelDelete').addEventListener('click', closeDeleteConfirm); $('confirmDelete').addEventListener('click', confirmDelete); $('confirmBackdrop').addEventListener('click', (e) => { if (e.target === $('confirmBackdrop')) closeDeleteConfirm(); }); $('itemForm').addEventListener('submit', submitForm); $('searchInput').addEventListener('input', render); $('statusFilter').addEventListener('click', toggleStatusMenu); document.querySelectorAll('.filter-option').forEach((option) => option.addEventListener('click', () => { setStatusFilter(option.dataset.value); closeStatusMenu(); render(); })); document.addEventListener('click', (e) => { if (!e.target.closest('#statusMenu')) closeStatusMenu(); }); $('exportBtn').addEventListener('click', exportData); $('importBtn').addEventListener('click', () => $('importFile').click());
        $('itemCategoryButton').addEventListener('click', toggleCategoryMenu); document.querySelectorAll('.form-menu-option').forEach((option) => option.addEventListener('click', () => { setCategory(option.dataset.value); closeCategoryMenu(); })); $('itemDateButton').addEventListener('click', openDatePicker); $('datePrev').addEventListener('click', () => { calendarCursor.setMonth(calendarCursor.getMonth() - 1); renderCalendar(); }); $('dateNext').addEventListener('click', () => { calendarCursor.setMonth(calendarCursor.getMonth() + 1); renderCalendar(); }); $('dateClear').addEventListener('click', () => { setDate(''); closeDatePicker(); }); $('itemTimeButton').addEventListener('click', openTimePicker); $('timeClear').addEventListener('click', () => { setTime(''); closeTimePicker(); }); document.addEventListener('click', (e) => { if (!e.target.closest('#categoryMenu')) closeCategoryMenu(); if (!e.target.closest('#datePicker')) closeDatePicker(); if (!e.target.closest('#timePicker')) closeTimePicker(); });
$('importFile').addEventListener('change', (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { try { const incoming = JSON.parse(reader.result); if (!incoming.packing || !incoming.schedule || !incoming.shopping) throw new Error(); data = incoming; saveData(); showToast('備份已匯入'); } catch { showToast('這不是有效的備份檔'); } e.target.value = ''; }; reader.readAsText(file); });
$('itemsList').addEventListener('click', (e) => { const control = e.target.closest('[data-action]'); if (!control) return; const item = currentItems().find((i) => i.id === control.dataset.id); if (!item) return; if (control.dataset.action === 'edit') openModal(item.id); if (control.dataset.action === 'delete') openDeleteConfirm(item); });
        $('itemsList').addEventListener('change', (e) => { if (e.target.dataset.action !== 'toggle') return; const item = currentItems().find((i) => i.id === e.target.dataset.id); if (item) { item.done = e.target.checked; saveData(); showToast(item.done ? '已標記完成' : '已恢復未完成'); } });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeDeleteConfirm(); closeStatusMenu(); closeFormPickers(); } });
        render(); registerWebMcp();
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=5').catch(() => {}));
